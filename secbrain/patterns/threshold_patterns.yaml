TBTC_BRIDGE_PATTERNS:
  bitcoin_peg_manipulation:
    pattern_type: bitcoin_peg_manipulation
    severity: critical
    description: Manipulation of Bitcoin peg mechanism to mint unbacked tBTC or prevent
      redemptions
    immunefi_category: Direct theft of any user funds
    max_bounty_usd: 1000000
    detection_heuristics:
    - mint
    - mintTBTC
    - optimisticMint
    - requestRedemption
    - bridge deposit
    - BTC transaction proof
    - SPV proof verification
    exploitation_steps:
    - 1. Find flaw in Bitcoin SPV proof verification
    - 2. Craft malicious Bitcoin transaction proof
    - 3. Submit proof to bridge to mint unbacked tBTC
    - '4. Alternative: Block legitimate redemptions by manipulating proof validation'
    mitigation_strategies:
    - Rigorous SPV proof validation with multiple confirmations
    - Time-delayed optimistic minting with challenge period
    - Guardian oversight for large mints
    - Rate limiting on mint operations
    - Multi-oracle consensus for Bitcoin transaction confirmation
    references:
    - https://docs.threshold.network/applications/tbtc-v2
    - https://immunefi.com/bug-bounty/thresholdnetwork/
    affected_contracts:
    - TBTC
    - TBTCVault
    - Bridge
  wallet_registry_compromise:
    pattern_type: wallet_registry_compromise
    severity: critical
    description: Compromise of wallet registry to control Bitcoin wallets or signing
      groups
    immunefi_category: Direct theft of any user funds
    max_bounty_usd: 1000000
    detection_heuristics:
    - registerWallet
    - updateWallet
    - walletOwner
    - signingGroup
    - operator registration
    - wallet public key
    exploitation_steps:
    - 1. Find access control flaw in wallet registration
    - 2. Register malicious wallet or compromise existing wallet
    - 3. Gain control of signing authority
    - 4. Steal deposited Bitcoin or prevent redemptions
    mitigation_strategies:
    - Strict access controls on wallet registry modifications
    - Multi-signature requirements for wallet updates
    - Time-delayed wallet changes with governance oversight
    - Operator stake slashing for malicious behavior
    references:
    - https://docs.threshold.network/staking-and-running-a-node/threshold-stake
    affected_contracts:
    - WalletRegistry
    - WalletCoordinator
    - Bridge
  redemption_proof_forgery:
    pattern_type: redemption_proof_forgery
    severity: critical
    description: Forging redemption proofs to steal Bitcoin from the bridge
    immunefi_category: Direct theft of any user funds
    max_bounty_usd: 1000000
    detection_heuristics:
    - requestRedemption
    - proveRedemption
    - submitRedemptionProof
    - Bitcoin transaction proof
    - redemption verification
    exploitation_steps:
    - 1. Analyze redemption proof verification logic
    - 2. Craft forged proof that bypasses validation
    - 3. Submit forged proof to claim Bitcoin
    - 4. Drain bridge funds through repeated false redemptions
    mitigation_strategies:
    - Cryptographic proof verification with multiple validators
    - Challenge period for redemptions
    - Rate limiting and anomaly detection
    - Guardian monitoring of large redemptions
    references:
    - https://docs.threshold.network/applications/tbtc-v2/tbtc-v2-technical-design
    affected_contracts:
    - Bridge
    - TBTCVault
    - RedemptionWatchtower
THRESHOLD_CRYPTO_PATTERNS:
  threshold_signature_manipulation:
    pattern_type: threshold_signature_manipulation
    severity: critical
    description: Manipulation of threshold signature scheme to bypass multi-party
      signing
    immunefi_category: Direct theft of any user funds
    max_bounty_usd: 1000000
    detection_heuristics:
    - threshold signature
    - ECDSA
    - signing group
    - signature aggregation
    - submitSignature
    - verifySignature
    exploitation_steps:
    - 1. Identify flaw in signature aggregation or verification
    - 2. Manipulate signature components to bypass threshold requirement
    - 3. Execute unauthorized transactions with forged signatures
    mitigation_strategies:
    - Formal verification of signature scheme implementation
    - Multiple independent signature verification layers
    - Operator stake requirements to prevent malicious signing
    - Slashing mechanism for invalid signatures
    references:
    - https://docs.threshold.network/app-development/threshold-access-control
    affected_contracts:
    - WalletRegistry
    - Bridge
    - ECDSA
  dkg_protocol_attack:
    pattern_type: dkg_protocol_attack
    severity: critical
    description: Attack on Distributed Key Generation protocol to compromise wallet
      keys
    immunefi_category: Direct theft of any user funds
    max_bounty_usd: 1000000
    detection_heuristics:
    - DKG
    - key generation
    - group formation
    - operator selection
    - randomness
    exploitation_steps:
    - 1. Exploit randomness source in DKG protocol
    - 2. Influence operator selection to include malicious nodes
    - 3. Compromise key shares during generation
    - 4. Reconstruct private key to steal funds
    mitigation_strategies:
    - Secure randomness source (Random Beacon)
    - Verification of DKG process integrity
    - Minimum stake requirements for operators
    - Key rotation and refreshing mechanisms
    references:
    - https://docs.threshold.network/staking-and-running-a-node/random-beacon-overview
    affected_contracts:
    - WalletRegistry
    - RandomBeacon
    - SortitionPool
  dkg_threshold_raising:
    pattern_type: dkg_threshold_raising
    severity: critical
    description: DKG result submission with polynomial degree higher than expected
      threshold, causing permanent fund freezing
    immunefi_category: Permanent freezing of funds (Protocol Insolvency)
    max_bounty_usd: 1000000
    detection_heuristics:
    - submitDkgResult
    - dkgValidator.validate
    - EcdsaDkgValidator
    - groupCommitment
    - groupPubKey
    - polynomial degree
    - threshold
    - commitment.length
    - result.misbehavedMembers
    - ECDSA DKG
    exploitation_steps:
    - 1. Identify WalletRegistry.submitDkgResult entry point
    - 2. Check if EcdsaDkgValidator.validate verifies polynomial degree
    - '3. Verify absence of: require(result.groupCommitment.length == threshold +
      1)'
    - 4. Coordinate malicious operators off-chain to produce higher-degree polynomial
    - 5. Submit DKG result with commitment.length = threshold + 2 (or higher)
    - 6. If accepted, new wallet cannot sign transactions (permanent fund lock)
    - 7. All tBTC deposits to compromised wallet are permanently frozen
    mitigation_strategies:
    - 'Add explicit check: require(result.groupCommitment.length == threshold + 1,
      ''Invalid polynomial degree'')'
    - Validate commitment vector size matches expected threshold parameter
    - Add pre-condition checks in submitDkgResult before delegation to validator
    - Implement slashing for operators submitting invalid-degree commitments
    - Add circuit breakers to pause wallet creation if anomalous commitments detected
    - Multiple independent validators for DKG result verification
    references:
    - https://eprint.iacr.org/2020/852.pdf (FROST DKG vulnerability)
    - https://github.com/safeheron/safeheron-api-sdk-js/security/advisories
    - https://docs.threshold.network/app-development/tbtc-contracts-api/ecdsa-api/walletregistry
    - https://docs.threshold.network/app-development/tbtc-contracts-api/ecdsa-api/ecdsadkgvalidator
    - 'Trail of Bits: Threshold cryptography implementation audits'
    affected_contracts:
    - WalletRegistry
    - EcdsaDkgValidator
    - EcdsaDkg
    - Bridge
  operator_collusion:
    pattern_type: operator_collusion
    severity: high
    description: Collusion attack where operators combine to bypass threshold requirements
    immunefi_category: Direct theft of any user funds
    max_bounty_usd: 1000000
    detection_heuristics:
    - operator count
    - threshold parameter
    - signature threshold
    - minimum operators
    exploitation_steps:
    - 1. Compromise or collude with enough operators to meet threshold
    - 2. Execute unauthorized signing operations
    - 3. Steal funds or disrupt protocol operation
    mitigation_strategies:
    - Higher threshold requirements (e.g., 51 of 100 instead of 3 of 5)
    - Economic incentives against collusion (high stake requirements)
    - Operator diversity and geographic distribution
    - Monitoring and anomaly detection for operator behavior
    references:
    - https://docs.threshold.network/staking-and-running-a-node/threshold-stake
    affected_contracts:
    - WalletRegistry
    - TokenStaking
