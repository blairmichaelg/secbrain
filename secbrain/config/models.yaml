# SecBrain Model Configuration - Groq primary / Perplexity research
version: "1.0"

worker:
  provider: groq
  model: llama-3.3-70b-versatile
  base_url: https://api.groq.com/openai/v1
  timeout: 30
  temperature: 0.3
  max_tokens: 2000
  top_p: 0.95

advisor:
  provider: groq
  model: llama-3.3-70b-versatile
  base_url: https://api.groq.com/openai/v1
  timeout: 30
  temperature: 0.7
  max_tokens: 1500
  top_p: 0.95

research:
  provider: perplexity
  model: sonar
  max_calls_per_run: 20
  max_calls_per_phase: 5

rpc:
  primary: alchemy
  primary_url: "${RPC_URL}"
  fallback_url: "https://eth.drpc.org"
  timeout: 10
  max_retries: 3
