name: 🔒 Comprehensive Security Analysis

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repository URL (e.g., https://github.com/user/repo)'
        required: true
        type: string
      target_type:
        description: 'Type of target project'
        required: true
        type: choice
        options:
          - smart-contract
          - python
          - mixed
        default: 'mixed'
      analysis_depth:
        description: 'Analysis depth (affects runtime and thoroughness)'
        required: true
        type: choice
        options:
          - quick
          - standard
          - deep
        default: 'standard'
      enable_ai_analysis:
        description: 'Enable AI-powered analysis with SecBrain agents'
        required: true
        type: boolean
        default: true
      enable_fuzzing:
        description: 'Enable fuzzing (Foundry/Echidna) - increases runtime significantly'
        required: true
        type: boolean
        default: true
      immunefi_program:
        description: 'Immunefi program name (optional, for additional intelligence)'
        required: false
        type: string
        default: ''
      instascope_path:
        description: 'Path to Instascope download directory (optional, for analyzing Immunefi downloads)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  issues: write
  security-events: write
  pull-requests: read

env:
  ANALYSIS_WORKSPACE: /tmp/analysis-workspace
  RESULTS_DIR: /tmp/analysis-results
  TARGET_DIR: /tmp/target-repo

jobs:
  # ============================================================================
  # Phase 1: Setup and Initial Reconnaissance
  # ============================================================================
  setup-and-recon:
    name: 🔍 Setup & Reconnaissance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      project_type: ${{ steps.detect.outputs.project_type }}
      has_solidity: ${{ steps.detect.outputs.has_solidity }}
      has_python: ${{ steps.detect.outputs.has_python }}
      has_foundry: ${{ steps.detect.outputs.has_foundry }}
      has_hardhat: ${{ steps.detect.outputs.has_hardhat }}
      solidity_version: ${{ steps.detect.outputs.solidity_version }}
      python_version: ${{ steps.detect.outputs.python_version }}
      complexity_score: ${{ steps.detect.outputs.complexity_score }}
    steps:
      - name: Validate target repository URL
        run: |
          # Basic URL validation to prevent command injection
          # GitHub repo names: alphanumeric, hyphens, underscores, and dots
          # Allow optional .git suffix and trailing slash
          if ! echo "${{ inputs.target_repo }}" | grep -qE '^https://github\.com/[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+(\.git)?/?$'; then
            echo "❌ Invalid repository URL format"
            echo "Expected: https://github.com/owner/repo or https://github.com/owner/repo.git"
            echo "Repository names can only contain letters, numbers, hyphens, underscores, and dots"
            exit 1
          fi
          echo "✅ Repository URL validated"

      - name: Checkout target repository
        id: clone
        run: |
          mkdir -p ${{ env.TARGET_DIR }}
          
          # Clone with timeout and better error handling
          if ! timeout 300 git clone --depth 1 --single-branch "${{ inputs.target_repo }}" "${{ env.TARGET_DIR }}"; then
            echo "❌ Failed to clone repository"
            echo "This could be due to:"
            echo "  - Invalid repository URL"
            echo "  - Network issues"
            echo "  - Private repository (requires authentication)"
            exit 1
          fi
          
          echo "✅ Repository cloned successfully"
          echo "clone_success=true" >> $GITHUB_OUTPUT

      - name: Copy Instascope downloads (if provided)
        if: inputs.instascope_path != ''
        run: |
          if [ -d "${{ inputs.instascope_path }}" ]; then
            echo "📦 Copying Instascope downloads from ${{ inputs.instascope_path }}"
            cp -r "${{ inputs.instascope_path }}"/* ${{ env.TARGET_DIR }}/ || true
            echo "✅ Instascope files copied"
          else
            echo "⚠️ Instascope path provided but directory not found: ${{ inputs.instascope_path }}"
          fi

      - name: Detect project characteristics
        id: detect
        if: steps.clone.outputs.clone_success == 'true'
        run: |
          cd ${{ env.TARGET_DIR }}
          
          # Initialize detection flags
          HAS_SOLIDITY="false"
          HAS_PYTHON="false"
          HAS_FOUNDRY="false"
          HAS_HARDHAT="false"
          SOLIDITY_VERSION="unknown"
          PYTHON_VERSION="unknown"
          
          # Check for Solidity files
          if find . -name "*.sol" -type f | grep -q .; then
            HAS_SOLIDITY="true"
            echo "✅ Detected Solidity contracts"
            
            # Try to extract Solidity version
            SOL_VERSION=$(grep -h "pragma solidity" $(find . -name "*.sol" -type f | head -1) | head -1 | sed 's/.*solidity[^0-9]*\([0-9.^]*\).*/\1/' || echo "unknown")
            SOLIDITY_VERSION=$SOL_VERSION
          fi
          
          # Check for Python files
          if find . -name "*.py" -type f | grep -q .; then
            HAS_PYTHON="true"
            echo "✅ Detected Python code"
            
            # Try to extract Python version from config
            if [ -f "pyproject.toml" ]; then
              PYTHON_VERSION=$(grep "requires-python" pyproject.toml | sed 's/.*"\([^"]*\)".*/\1/' || echo "3.11")
            elif [ -f ".python-version" ]; then
              PYTHON_VERSION=$(cat .python-version)
            else
              PYTHON_VERSION="3.11"
            fi
          fi
          
          # Check for Foundry
          if [ -f "foundry.toml" ]; then
            HAS_FOUNDRY="true"
            echo "✅ Detected Foundry project"
          fi
          
          # Check for Hardhat
          if [ -f "hardhat.config.js" ] || [ -f "hardhat.config.ts" ]; then
            HAS_HARDHAT="true"
            echo "✅ Detected Hardhat project"
          fi
          
          # Determine project type
          PROJECT_TYPE="${{ inputs.target_type }}"
          
          # Calculate complexity score (simple heuristic)
          SOL_COUNT=$(find . -name "*.sol" -type f | wc -l)
          PY_COUNT=$(find . -name "*.py" -type f | wc -l)
          COMPLEXITY=$((SOL_COUNT + PY_COUNT))
          
          # Set outputs
          echo "project_type=$PROJECT_TYPE" >> $GITHUB_OUTPUT
          echo "has_solidity=$HAS_SOLIDITY" >> $GITHUB_OUTPUT
          echo "has_python=$HAS_PYTHON" >> $GITHUB_OUTPUT
          echo "has_foundry=$HAS_FOUNDRY" >> $GITHUB_OUTPUT
          echo "has_hardhat=$HAS_HARDHAT" >> $GITHUB_OUTPUT
          echo "solidity_version=$SOLIDITY_VERSION" >> $GITHUB_OUTPUT
          echo "python_version=$PYTHON_VERSION" >> $GITHUB_OUTPUT
          echo "complexity_score=$COMPLEXITY" >> $GITHUB_OUTPUT
          
          echo "📊 Project Analysis:"
          echo "  - Type: $PROJECT_TYPE"
          echo "  - Solidity: $HAS_SOLIDITY ($SOL_COUNT files)"
          echo "  - Python: $HAS_PYTHON ($PY_COUNT files)"
          echo "  - Foundry: $HAS_FOUNDRY"
          echo "  - Hardhat: $HAS_HARDHAT"
          echo "  - Complexity: $COMPLEXITY files"

      - name: Cache target repository
        uses: actions/cache@v4
        with:
          path: ${{ env.TARGET_DIR }}
          key: target-repo-${{ github.run_id }}-${{ github.run_attempt }}

  # ============================================================================
  # Phase 2: Static Analysis (Parallel Execution)
  # ============================================================================
  
  static-analysis-solidity:
    name: 🔐 Solidity Static Analysis
    runs-on: ubuntu-latest
    needs: setup-and-recon
    if: needs.setup-and-recon.outputs.has_solidity == 'true'
    timeout-minutes: 30
    steps:
      - name: Restore target repository
        uses: actions/cache@v4
        with:
          path: ${{ env.TARGET_DIR }}
          key: target-repo-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Solidity security tools
        run: |
          npm install -g solhint
          pip install slither-analyzer

      - name: Run Slither
        id: slither
        continue-on-error: true
        run: |
          mkdir -p ${{ env.RESULTS_DIR }}/slither
          cd ${{ env.TARGET_DIR }}
          
          # Run Slither with different configurations based on depth
          SLITHER_ARGS="--json ${{ env.RESULTS_DIR }}/slither/slither-results.json"
          
          if [ "${{ inputs.analysis_depth }}" = "quick" ]; then
            SLITHER_ARGS="$SLITHER_ARGS --exclude-low --exclude-informational --exclude-optimization"
          elif [ "${{ inputs.analysis_depth }}" = "standard" ]; then
            SLITHER_ARGS="$SLITHER_ARGS --exclude-informational --exclude-optimization"
          fi
          # For deep mode, include all checks (no exclusions)
          
          slither . $SLITHER_ARGS || true
          slither . --print human-summary > ${{ env.RESULTS_DIR }}/slither/summary.txt 2>&1 || true

      - name: Run Solhint
        continue-on-error: true
        run: |
          mkdir -p ${{ env.RESULTS_DIR }}/solhint
          cd ${{ env.TARGET_DIR }}
          
          find . -name "*.sol" -type f ! -path "*/node_modules/*" ! -path "*/.git/*" > sol_files.txt
          if [ -s sol_files.txt ]; then
            solhint $(cat sol_files.txt) --format json > ${{ env.RESULTS_DIR }}/solhint/results.json || true
          fi

      - name: Upload Solidity static analysis results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: static-analysis-solidity
          path: |
            ${{ env.RESULTS_DIR }}/slither/
            ${{ env.RESULTS_DIR }}/solhint/
          retention-days: 90
          if-no-files-found: warn

  static-analysis-python:
    name: 🐍 Python Static Analysis
    runs-on: ubuntu-latest
    needs: setup-and-recon
    if: needs.setup-and-recon.outputs.has_python == 'true'
    timeout-minutes: 20
    steps:
      - name: Restore target repository
        uses: actions/cache@v4
        with:
          path: ${{ env.TARGET_DIR }}
          key: target-repo-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.setup-and-recon.outputs.python_version }}
          cache: 'pip'

      - name: Install Python security tools
        run: |
          pip install --upgrade pip
          pip install bandit[toml] safety pip-audit semgrep detect-secrets

      - name: Run Bandit
        continue-on-error: true
        run: |
          mkdir -p ${{ env.RESULTS_DIR }}/bandit
          cd ${{ env.TARGET_DIR }}
          
          # Adjust Bandit severity based on depth
          # -l = low severity, -ll = medium, -lll = high
          SEVERITY_LEVEL="-ll"
          if [ "${{ inputs.analysis_depth }}" = "quick" ]; then
            SEVERITY_LEVEL="-ll"  # Medium and high only
          elif [ "${{ inputs.analysis_depth }}" = "deep" ]; then
            SEVERITY_LEVEL="-lll"  # All severities including low
          fi
          
          bandit -r . $SEVERITY_LEVEL -f json -o ${{ env.RESULTS_DIR }}/bandit/results.json || true

      - name: Run detect-secrets
        continue-on-error: true
        run: |
          mkdir -p ${{ env.RESULTS_DIR }}/detect-secrets
          cd ${{ env.TARGET_DIR }}
          
          # Scan for secrets in the codebase
          detect-secrets scan --all-files --force-use-all-plugins > ${{ env.RESULTS_DIR }}/detect-secrets/baseline.json || true
          
          # Generate a summary
          if [ -f "${{ env.RESULTS_DIR }}/detect-secrets/baseline.json" ]; then
            SECRET_COUNT=$(jq '.results | to_entries | map(.value | length) | add // 0' ${{ env.RESULTS_DIR }}/detect-secrets/baseline.json)
            echo "Found $SECRET_COUNT potential secrets" | tee ${{ env.RESULTS_DIR }}/detect-secrets/summary.txt
          fi

      - name: Run Safety
        continue-on-error: true
        run: |
          mkdir -p ${{ env.RESULTS_DIR }}/safety
          cd ${{ env.TARGET_DIR }}
          safety check --json --output ${{ env.RESULTS_DIR }}/safety/results.json || true

      - name: Run pip-audit
        continue-on-error: true
        run: |
          mkdir -p ${{ env.RESULTS_DIR }}/pip-audit
          cd ${{ env.TARGET_DIR }}
          pip-audit --format json --output ${{ env.RESULTS_DIR }}/pip-audit/results.json || true

      - name: Run Semgrep
        continue-on-error: true
        run: |
          mkdir -p ${{ env.RESULTS_DIR }}/semgrep
          cd ${{ env.TARGET_DIR }}
          
          # Run with auto config for general security rules
          semgrep --config=auto --json --output=${{ env.RESULTS_DIR }}/semgrep/results.json . || true

      - name: Upload Python static analysis results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: static-analysis-python
          path: |
            ${{ env.RESULTS_DIR }}/bandit/
            ${{ env.RESULTS_DIR }}/safety/
            ${{ env.RESULTS_DIR }}/pip-audit/
            ${{ env.RESULTS_DIR }}/semgrep/
            ${{ env.RESULTS_DIR }}/detect-secrets/
          retention-days: 90
          if-no-files-found: warn

  # ============================================================================
  # Phase 3: Dynamic Analysis & Fuzzing
  # ============================================================================
  
  dynamic-analysis-foundry:
    name: ⚡ Foundry Fuzzing
    runs-on: ubuntu-latest
    needs: setup-and-recon
    if: |
      inputs.enable_fuzzing == true && 
      needs.setup-and-recon.outputs.has_foundry == 'true'
    timeout-minutes: ${{ inputs.analysis_depth == 'quick' && 15 || inputs.analysis_depth == 'standard' && 45 || 120 }}
    steps:
      - name: Restore target repository
        uses: actions/cache@v4
        with:
          path: ${{ env.TARGET_DIR }}
          key: target-repo-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run Foundry fuzzing
        run: |
          mkdir -p ${{ env.RESULTS_DIR }}/foundry
          cd ${{ env.TARGET_DIR }}
          
          # Configure fuzz runs based on depth
          FUZZ_RUNS=256
          if [ "${{ inputs.analysis_depth }}" = "standard" ]; then
            FUZZ_RUNS=1000
          elif [ "${{ inputs.analysis_depth }}" = "deep" ]; then
            FUZZ_RUNS=10000
          fi
          
          echo "Running Foundry tests with $FUZZ_RUNS fuzz runs..."
          
          # Build first
          forge build || true
          
          # Run tests with fuzzing
          FOUNDRY_FUZZ_RUNS=$FUZZ_RUNS forge test --json > ${{ env.RESULTS_DIR }}/foundry/test-results.json || true
          
          # Run gas report
          forge test --gas-report > ${{ env.RESULTS_DIR }}/foundry/gas-report.txt || true

      - name: Upload Foundry fuzzing results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dynamic-analysis-foundry
          path: ${{ env.RESULTS_DIR }}/foundry/
          retention-days: 90
          if-no-files-found: warn

  dynamic-analysis-echidna:
    name: 🦇 Echidna Property Testing
    runs-on: ubuntu-latest
    needs: setup-and-recon
    if: |
      inputs.enable_fuzzing == true && 
      inputs.analysis_depth == 'deep' &&
      needs.setup-and-recon.outputs.has_solidity == 'true'
    timeout-minutes: 60
    steps:
      - name: Restore target repository
        uses: actions/cache@v4
        with:
          path: ${{ env.TARGET_DIR }}
          key: target-repo-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Install Echidna
        run: |
          # Install Echidna using Docker for reliability
          docker pull trailofbits/eth-security-toolbox

      - name: Run Echidna
        continue-on-error: true
        run: |
          mkdir -p ${{ env.RESULTS_DIR }}/echidna
          cd ${{ env.TARGET_DIR }}
          
          # Find test contracts
          find . -name "*Test*.sol" -o -name "*Invariant*.sol" | while read test_file; do
            echo "Running Echidna on $test_file"
            docker run -v $PWD:/src trailofbits/eth-security-toolbox \
              echidna-test /src/$test_file --format json > ${{ env.RESULTS_DIR }}/echidna/$(basename $test_file).json || true
          done

      - name: Upload Echidna results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dynamic-analysis-echidna
          path: ${{ env.RESULTS_DIR }}/echidna/
          retention-days: 90
          if-no-files-found: warn

  # ============================================================================
  # Phase 4: Symbolic Execution
  # ============================================================================
  
  symbolic-execution-mythril:
    name: 🔮 Mythril Symbolic Execution
    runs-on: ubuntu-latest
    needs: setup-and-recon
    if: |
      inputs.analysis_depth == 'deep' &&
      needs.setup-and-recon.outputs.has_solidity == 'true'
    timeout-minutes: 45
    steps:
      - name: Restore target repository
        uses: actions/cache@v4
        with:
          path: ${{ env.TARGET_DIR }}
          key: target-repo-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Install Mythril
        run: |
          pip install mythril

      - name: Run Mythril
        continue-on-error: true
        run: |
          mkdir -p ${{ env.RESULTS_DIR }}/mythril
          cd ${{ env.TARGET_DIR }}
          
          # Limit to main contracts (not tests) to save time
          find . -name "*.sol" -type f ! -name "*Test*" ! -path "*/test/*" | head -10 | while read sol_file; do
            echo "Analyzing $sol_file with Mythril..."
            myth analyze "$sol_file" -o json > "${{ env.RESULTS_DIR }}/mythril/$(basename $sol_file).json" 2>&1 || true
          done

      - name: Upload Mythril results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: symbolic-execution-mythril
          path: ${{ env.RESULTS_DIR }}/mythril/
          retention-days: 90
          if-no-files-found: warn

  # ============================================================================
  # Phase 5: AI-Powered Analysis
  # ============================================================================
  
  ai-analysis-secbrain:
    name: 🤖 SecBrain AI Analysis
    runs-on: ubuntu-latest
    needs: [setup-and-recon, static-analysis-solidity, static-analysis-python]
    if: inputs.enable_ai_analysis == true
    timeout-minutes: 30
    steps:
      - name: Checkout SecBrain
        uses: actions/checkout@v6

      - name: Restore target repository
        uses: actions/cache@v4
        with:
          path: ${{ env.TARGET_DIR }}
          key: target-repo-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install SecBrain
        run: |
          cd secbrain
          pip install --require-hashes -r requirements.lock
          pip install -e ".[dev]"

      - name: Run AI Engineer Analysis
        continue-on-error: true
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          mkdir -p ${{ env.RESULTS_DIR }}/ai-analysis
          
          # Run codebase analysis - use correct path to SecBrain scripts
          cd ${{ env.TARGET_DIR }}
          python3 "$GITHUB_WORKSPACE/scripts/ai_engineer_analysis.py" > ${{ env.RESULTS_DIR }}/ai-analysis/codebase-analysis.json || true

      - name: Run Security Intelligence Gathering
        continue-on-error: true
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/security_intelligence.py" > ${{ env.RESULTS_DIR }}/ai-analysis/security-intel.json || true

      - name: Generate AI Recommendations
        continue-on-error: true
        run: |
          # Combine analysis and intelligence for recommendations
          # Check if both files exist before attempting to merge
          if [ -f "${{ env.RESULTS_DIR }}/ai-analysis/codebase-analysis.json" ] && [ -f "${{ env.RESULTS_DIR }}/ai-analysis/security-intel.json" ]; then
            jq -s '{"codebase_analysis": .[0], "security_intel": .[1]}' \
              ${{ env.RESULTS_DIR }}/ai-analysis/codebase-analysis.json \
              ${{ env.RESULTS_DIR }}/ai-analysis/security-intel.json | \
              python3 "$GITHUB_WORKSPACE/scripts/generate_recommendations.py" > ${{ env.RESULTS_DIR }}/ai-analysis/recommendations.json || true
          else
            echo "⚠️ Missing required files for recommendations generation" >&2
            echo '{"error": "Missing input files"}' > ${{ env.RESULTS_DIR }}/ai-analysis/recommendations.json
          fi

      - name: Get Immunefi Intelligence
        if: inputs.immunefi_program != ''
        continue-on-error: true
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          cd secbrain
          secbrain immunefi intelligence --program ${{ inputs.immunefi_program }} > ${{ env.RESULTS_DIR }}/ai-analysis/immunefi-intel.json || true

      - name: Upload AI analysis results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ai-analysis-secbrain
          path: ${{ env.RESULTS_DIR }}/ai-analysis/
          retention-days: 90
          if-no-files-found: warn

  # ============================================================================
  # Phase 6: Results Aggregation and Reporting
  # ============================================================================
  
  aggregate-and-report:
    name: 📊 Aggregate Results & Report
    runs-on: ubuntu-latest
    needs: [setup-and-recon]
    if: always() && needs.setup-and-recon.result != 'failure'
    timeout-minutes: 15
    steps:
      - name: Checkout SecBrain
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install --upgrade pip

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: ${{ env.RESULTS_DIR }}/artifacts
        continue-on-error: true

      - name: Aggregate results into unified JSON
        continue-on-error: true
        run: |
          mkdir -p ${{ env.RESULTS_DIR }}/final
          
          # Use the Python aggregation script for better accuracy
          python scripts/aggregate_results.py "${{ env.RESULTS_DIR }}/artifacts" > ${{ env.RESULTS_DIR }}/final/tool-counts.json || true
          
          # Extract counts from the aggregation result
          if [ -f "${{ env.RESULTS_DIR }}/final/tool-counts.json" ]; then
            TOTAL_ISSUES=$(jq -r '.summary.total_issues // 0' ${{ env.RESULTS_DIR }}/final/tool-counts.json)
            CRITICAL_ISSUES=$(jq -r '.summary.critical_issues // 0' ${{ env.RESULTS_DIR }}/final/tool-counts.json)
            HIGH_ISSUES=$(jq -r '.summary.high_issues // 0' ${{ env.RESULTS_DIR }}/final/tool-counts.json)
            MEDIUM_ISSUES=$(jq -r '.summary.medium_issues // 0' ${{ env.RESULTS_DIR }}/final/tool-counts.json)
            LOW_ISSUES=$(jq -r '.summary.low_issues // 0' ${{ env.RESULTS_DIR }}/final/tool-counts.json)
          else
            # Fallback to basic counting if aggregation script fails
            TOTAL_ISSUES=0
            CRITICAL_ISSUES=0
            HIGH_ISSUES=0
            MEDIUM_ISSUES=0
            LOW_ISSUES=0
            
            # Count issues from Bandit
            if [ -f "${{ env.RESULTS_DIR }}/artifacts/static-analysis-python/bandit/results.json" ]; then
              BANDIT_HIGH=$(jq '[.results[] | select(.issue_severity == "HIGH")] | length' "${{ env.RESULTS_DIR }}/artifacts/static-analysis-python/bandit/results.json" 2>/dev/null || echo "0")
              BANDIT_MEDIUM=$(jq '[.results[] | select(.issue_severity == "MEDIUM")] | length' "${{ env.RESULTS_DIR }}/artifacts/static-analysis-python/bandit/results.json" 2>/dev/null || echo "0")
              HIGH_ISSUES=$((HIGH_ISSUES + BANDIT_HIGH))
              MEDIUM_ISSUES=$((MEDIUM_ISSUES + BANDIT_MEDIUM))
              echo "📊 Bandit: $BANDIT_HIGH high, $BANDIT_MEDIUM medium"
            fi
            
            # Count issues from Slither
            if [ -f "${{ env.RESULTS_DIR }}/artifacts/static-analysis-solidity/slither/slither-results.json" ]; then
              SLITHER_HIGH=$(jq '[.results.detectors[] | select(.impact == "High")] | length' "${{ env.RESULTS_DIR }}/artifacts/static-analysis-solidity/slither/slither-results.json" 2>/dev/null || echo "0")
              SLITHER_MEDIUM=$(jq '[.results.detectors[] | select(.impact == "Medium")] | length' "${{ env.RESULTS_DIR }}/artifacts/static-analysis-solidity/slither/slither-results.json" 2>/dev/null || echo "0")
              HIGH_ISSUES=$((HIGH_ISSUES + SLITHER_HIGH))
              MEDIUM_ISSUES=$((MEDIUM_ISSUES + SLITHER_MEDIUM))
              echo "📊 Slither: $SLITHER_HIGH high, $SLITHER_MEDIUM medium"
            fi
            
            # Count issues from Safety
            if [ -f "${{ env.RESULTS_DIR }}/artifacts/static-analysis-python/safety/results.json" ]; then
              SAFETY_VULNS=$(jq '.vulnerabilities | length' "${{ env.RESULTS_DIR }}/artifacts/static-analysis-python/safety/results.json" 2>/dev/null || echo "0")
              CRITICAL_ISSUES=$((CRITICAL_ISSUES + SAFETY_VULNS))
              echo "📊 Safety: $SAFETY_VULNS vulnerabilities"
            fi
            
            # Calculate total
            TOTAL_ISSUES=$((CRITICAL_ISSUES + HIGH_ISSUES + MEDIUM_ISSUES + LOW_ISSUES))
          fi
          
          echo "📊 Total issues: $TOTAL_ISSUES (Critical: $CRITICAL_ISSUES, High: $HIGH_ISSUES, Medium: $MEDIUM_ISSUES, Low: $LOW_ISSUES)"
          
          # Create aggregated JSON with actual counts
          cat > ${{ env.RESULTS_DIR }}/final/aggregated-results.json << EOJSON
          {
            "analysis_metadata": {
              "target_repo": "${{ inputs.target_repo }}",
              "target_type": "${{ inputs.target_type }}",
              "analysis_depth": "${{ inputs.analysis_depth }}",
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "workflow_run": "${{ github.run_id }}",
              "workflow_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "project_characteristics": {
                "has_solidity": "${{ needs.setup-and-recon.outputs.has_solidity }}",
                "has_python": "${{ needs.setup-and-recon.outputs.has_python }}",
                "has_foundry": "${{ needs.setup-and-recon.outputs.has_foundry }}",
                "complexity_score": "${{ needs.setup-and-recon.outputs.complexity_score }}"
              }
            },
            "findings": {
              "static_analysis": {
                "bandit_available": $([ -f "${{ env.RESULTS_DIR }}/artifacts/static-analysis-python/bandit/results.json" ] && echo "true" || echo "false"),
                "slither_available": $([ -f "${{ env.RESULTS_DIR }}/artifacts/static-analysis-solidity/slither/slither-results.json" ] && echo "true" || echo "false"),
                "safety_available": $([ -f "${{ env.RESULTS_DIR }}/artifacts/static-analysis-python/safety/results.json" ] && echo "true" || echo "false")
              },
              "dynamic_analysis": {
                "foundry_available": $([ -d "${{ env.RESULTS_DIR }}/artifacts/dynamic-analysis-foundry" ] && echo "true" || echo "false"),
                "echidna_available": $([ -d "${{ env.RESULTS_DIR }}/artifacts/dynamic-analysis-echidna" ] && echo "true" || echo "false")
              },
              "symbolic_execution": {
                "mythril_available": $([ -d "${{ env.RESULTS_DIR }}/artifacts/symbolic-execution-mythril" ] && echo "true" || echo "false")
              },
              "ai_insights": {
                "secbrain_available": $([ -d "${{ env.RESULTS_DIR }}/artifacts/ai-analysis-secbrain" ] && echo "true" || echo "false")
              }
            },
            "summary": {
              "total_issues": $TOTAL_ISSUES,
              "critical_issues": $CRITICAL_ISSUES,
              "high_issues": $HIGH_ISSUES,
              "medium_issues": $MEDIUM_ISSUES,
              "low_issues": $LOW_ISSUES
            },
            "artifacts_location": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOJSON
          
          echo "✅ Aggregated results created"
          
          # Save counts for use in report
          echo "TOTAL_ISSUES=$TOTAL_ISSUES" >> $GITHUB_ENV
          echo "CRITICAL_ISSUES=$CRITICAL_ISSUES" >> $GITHUB_ENV
          echo "HIGH_ISSUES=$HIGH_ISSUES" >> $GITHUB_ENV
          echo "MEDIUM_ISSUES=$MEDIUM_ISSUES" >> $GITHUB_ENV
          echo "LOW_ISSUES=$LOW_ISSUES" >> $GITHUB_ENV

      - name: Generate Markdown Report
        run: |
          cat > ${{ env.RESULTS_DIR }}/final/ANALYSIS-REPORT.md << EOMD
          # 🔒 Comprehensive Security Analysis Report
          
          **Target Repository:** ${{ inputs.target_repo }}
          **Analysis Type:** ${{ inputs.target_type }}
          **Analysis Depth:** ${{ inputs.analysis_depth }}
          **Timestamp:** $(date -u +%Y-%m-%d\ %H:%M:%S\ UTC)
          **Workflow Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          ---
          
          ## 📋 Executive Summary
          
          This comprehensive security analysis was performed using 13+ industry-standard tools
          and AI-powered analysis to identify vulnerabilities, code quality issues, and security
          best practice violations.
          
          ### Project Characteristics
          
          - **Solidity Contracts:** ${{ needs.setup-and-recon.outputs.has_solidity }}
          - **Python Code:** ${{ needs.setup-and-recon.outputs.has_python }}
          - **Foundry Project:** ${{ needs.setup-and-recon.outputs.has_foundry }}
          - **Complexity Score:** ${{ needs.setup-and-recon.outputs.complexity_score }}
          
          ---
          
          ## 🔍 Analysis Coverage
          
          ### Static Analysis
          - ✅ **Slither** - Solidity static analysis
          - ✅ **Solhint** - Solidity linting
          - ✅ **Bandit** - Python security scanning
          - ✅ **Safety** - Dependency vulnerability scanning
          - ✅ **pip-audit** - Python package auditing
          - ✅ **Semgrep** - Pattern-based security analysis
          - ✅ **detect-secrets** - Secret scanning
          
          ### Dynamic Analysis
          ${{ inputs.enable_fuzzing == true && '- ✅ **Foundry Fuzzing** - Property-based testing' || '- ⏭️ Foundry Fuzzing (disabled)' }}
          ${{ inputs.analysis_depth == 'deep' && '- ✅ **Echidna** - Advanced property testing' || '- ⏭️ Echidna (only in deep mode)' }}
          
          ### Symbolic Execution
          ${{ inputs.analysis_depth == 'deep' && '- ✅ **Mythril** - Symbolic execution analysis' || '- ⏭️ Mythril (only in deep mode)' }}
          
          ### AI-Powered Analysis
          ${{ inputs.enable_ai_analysis == true && '- ✅ **SecBrain Agents** - Multi-agent security analysis' || '- ⏭️ AI Analysis (disabled)' }}
          ${{ inputs.enable_ai_analysis == true && '- ✅ **Security Intelligence** - Threat landscape analysis' || '' }}
          ${{ inputs.immunefi_program != '' && format('- ✅ **Immunefi Intelligence** - {0}', inputs.immunefi_program) || '' }}
          
          ---
          
          ## 📊 Findings Summary
          
          | Severity | Count | Status |
          |----------|-------|--------|
          | 🔴 Critical | \${CRITICAL_ISSUES:-0} | Requires immediate action |
          | 🟠 High | \${HIGH_ISSUES:-0} | Should be addressed soon |
          | 🟡 Medium | \${MEDIUM_ISSUES:-0} | Plan for remediation |
          | 🟢 Low | \${LOW_ISSUES:-0} | Consider addressing |
          | 📊 **Total** | **\${TOTAL_ISSUES:-0}** | **All findings** |
          
          *Detailed findings are available in the artifacts and aggregated JSON report.*
          
          ---
          
          ## 🎯 Key Recommendations
          
          Based on the AI-powered analysis and security intelligence:
          
          1. **Immediate Actions** - Address all critical and high severity findings
          2. **Short-term** - Implement recommended security patterns
          3. **Long-term** - Enhance testing coverage and adopt best practices
          
          See \`ai-analysis/recommendations.json\` for detailed, context-aware suggestions.
          
          ---
          
          ## 📦 Artifacts
          
          All analysis results are available as workflow artifacts:
          
          - \`aggregated-results.json\` - Unified JSON with all findings
          - \`static-analysis-*\` - Static analysis tool outputs
          - \`dynamic-analysis-*\` - Fuzzing and testing results
          - \`ai-analysis-*\` - AI-generated insights and recommendations
          
          **Retention:** 90 days
          
          [Download Artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          ---
          
          ## 🔄 Next Steps
          
          1. **Review** this report and download artifacts
          2. **Prioritize** findings by severity
          3. **Remediate** critical and high severity issues
          4. **Re-run** analysis after fixes to verify
          5. **Integrate** into CI/CD for continuous security
          
          ---
          
          ## 📚 Resources
          
          - [SecBrain Documentation](https://github.com/blairmichaelg/secbrain)
          - [Workflow Configuration](${{ github.server_url }}/${{ github.repository }}/blob/main/.github/workflows/comprehensive-security-analysis.yml)
          - [Security Best Practices](https://github.com/blairmichaelg/secbrain/blob/main/docs/)
          
          ---
          
          *Generated by SecBrain Comprehensive Security Analysis v1.0*
          *Analysis depth: ${{ inputs.analysis_depth }} | AI-powered: ${{ inputs.enable_ai_analysis }} | Fuzzing: ${{ inputs.enable_fuzzing }}*
          EOMD

      - name: Create GitHub Issue with Results
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            
            // Read the markdown report
            let reportBody = '';
            try {
              reportBody = fs.readFileSync('${{ env.RESULTS_DIR }}/final/ANALYSIS-REPORT.md', 'utf8');
            } catch (e) {
              reportBody = '# Analysis Report\n\nError loading report: ' + e.message;
            }
            
            // Create issue
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔒 Security Analysis: ${{ inputs.target_repo }} (${{ inputs.analysis_depth }})`,
              body: reportBody,
              labels: ['security-analysis', 'automated', '${{ inputs.analysis_depth }}-analysis', '${{ inputs.target_type }}']
            });
            
            console.log(`Created issue #${issue.data.number}`);
            core.summary.addRaw(`\n## 📝 Issue Created\n\nSee [issue #${issue.data.number}](${issue.data.html_url}) for full report.`);

      - name: Upload final aggregated results
        uses: actions/upload-artifact@v6
        with:
          name: comprehensive-analysis-results
          path: ${{ env.RESULTS_DIR }}/final/**/*
          retention-days: 90

      - name: Generate workflow summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOSUMMARY
          ## 🔒 Comprehensive Security Analysis Complete
          
          ### 📋 Analysis Configuration
          
          | Parameter | Value |
          |-----------|-------|
          | Target Repository | ${{ inputs.target_repo }} |
          | Target Type | ${{ inputs.target_type }} |
          | Analysis Depth | ${{ inputs.analysis_depth }} |
          | AI Analysis | ${{ inputs.enable_ai_analysis }} |
          | Fuzzing Enabled | ${{ inputs.enable_fuzzing }} |
          | Immunefi Program | ${{ inputs.immunefi_program || 'N/A' }} |
          | Instascope Path | ${{ inputs.instascope_path || 'N/A' }} |
          
          ### 🎯 Tools Executed
          
          #### Static Analysis
          - ✅ Slither (Solidity)
          - ✅ Solhint (Solidity)
          - ✅ Bandit (Python)
          - ✅ Safety (Dependencies)
          - ✅ pip-audit (Packages)
          - ✅ Semgrep (Patterns)
          - ✅ detect-secrets (Hardcoded secrets)
          
          #### Dynamic Analysis
          ${{ inputs.enable_fuzzing == true && '- ✅ Foundry Fuzzing' || '- ⏭️ Foundry (disabled)' }}
          ${{ inputs.analysis_depth == 'deep' && inputs.enable_fuzzing == true && '- ✅ Echidna' || '- ⏭️ Echidna (deep mode only)' }}
          
          #### Symbolic Execution
          ${{ inputs.analysis_depth == 'deep' && '- ✅ Mythril' || '- ⏭️ Mythril (deep mode only)' }}
          
          #### AI-Powered Analysis
          ${{ inputs.enable_ai_analysis == true && '- ✅ SecBrain Multi-Agent Analysis' || '- ⏭️ AI Analysis (disabled)' }}
          ${{ inputs.enable_ai_analysis == true && '- ✅ Security Intelligence Gathering' || '' }}
          ${{ inputs.enable_ai_analysis == true && '- ✅ AI-Generated Recommendations' || '' }}
          
          ### 📦 Artifacts Generated
          
          - \`comprehensive-analysis-results\` - Final aggregated report
          - \`static-analysis-*\` - Static analysis outputs
          - \`dynamic-analysis-*\` - Fuzzing results
          - \`ai-analysis-*\` - AI insights and recommendations
          
          ### ⏱️ Analysis Duration
          
          | Depth | Typical Runtime |
          |-------|----------------|
          | Quick | 5-15 minutes |
          | Standard | 30-60 minutes |
          | Deep | 2-4 hours |
          
          ### 🔄 Recommended Next Steps
          
          1. Review the created GitHub issue for the full report
          2. Download and analyze detailed findings from artifacts
          3. Address critical and high severity issues
          4. Re-run analysis after implementing fixes
          5. Consider integrating into CI/CD for continuous security
          
          ### 📚 Documentation
          
          - [Workflow Guide](${{ github.server_url }}/${{ github.repository }}/blob/main/.github/workflows/BOUNTY_WORKFLOWS_README.md)
          - [SecBrain Documentation](https://github.com/blairmichaelg/secbrain/blob/main/README.md)
          - [Customization Guide](${{ github.server_url }}/${{ github.repository }}/blob/main/WORKFLOW_OPTIMIZATION_GUIDE.md)
          
          ---
          
          *Comprehensive security analysis powered by SecBrain* 🎯
          EOSUMMARY
